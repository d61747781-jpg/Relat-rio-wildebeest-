<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Embarque e Desembarque de Equipamentos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }

        /* Correção para evitar página em branco no PDF */
        @page {
            size: A4;
            margin: 10mm;
        }

        @media print {
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            body, html {
                background: white !important;
                color: black !important;
                height: auto !important;
                overflow: visible !important;
            }
            .no-print, header, main, .no-print-btn {
                display: none !important;
            }
            #modalRelatorio {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                background: white !important;
                display: block !important;
                padding: 0 !important;
                margin: 0 !important;
                overflow: visible !important;
            }
            #modalRelatorio > div {
                box-shadow: none !important;
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                border: none !important;
                border-radius: 0 !important;
            }
            #conteudoRelatorioImpresso {
                max-height: none !important;
                overflow: visible !important;
                padding: 0 !important;
                background: white !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-12" onload="carregarRascunho()">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50 no-print">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2 rounded-lg text-white">
                    <i class="fa-solid fa-ship text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base md:text-lg leading-tight">Relatório de Embarque e Desembarque</h1>
                    <p class="text-xs text-slate-400">ROV Operations</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="salvarRascunhoManual()" title="Salvar progresso" class="bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1.5">
                    <i class="fa-solid fa-floppy-disk"></i> Salvar
                </button>
                <button id="btnPronto" onclick="gerarRelatorioFinal()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow flex items-center gap-2">
                    <i class="fa-solid fa-check"></i> Pronto
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 mt-6 no-print">
        
        <!-- Formulário Principal -->
        <form id="formRelatorio" class="space-y-6" onsubmit="return false;">

            <!-- Tipo de Relatório -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-3">Tipo de Relatório</label>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" id="tipoEmbarque" onclick="setTipo('Embarque')" class="py-3 px-4 rounded-xl border-2 font-medium flex items-center justify-center gap-2 transition border-blue-600 bg-blue-50 text-blue-700">
                        <i class="fa-solid fa-anchor"></i> Embarque
                    </button>
                    <button type="button" id="tipoDesembarque" onclick="setTipo('Desembarque')" class="py-3 px-4 rounded-xl border-2 font-medium flex items-center justify-center gap-2 transition border-slate-200 bg-white text-slate-600 hover:border-slate-300">
                        <i class="fa-solid fa-ship"></i> Desembarque
                    </button>
                </div>
                <input type="hidden" id="valTipo" value="Embarque">
            </div>

            <!-- Dados Gerais do Movimento -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-4">
                <div class="flex items-center gap-2 text-blue-700 font-semibold text-sm border-b pb-2">
                    <i class="fa-solid fa-file-lines"></i>
                    <span id="tituloSecaoMovimento">RELATÓRIO DE EMBARQUE</span>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label id="labelDestino" class="block text-xs font-semibold text-slate-600 mb-1">Recebido do(a)</label>
                        <input type="text" id="destino" placeholder="Ex: Base / Navio / Oficina" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label id="labelData" class="block text-xs font-semibold text-slate-600 mb-1">Data de Embarque</label>
                        <input type="date" id="dataMov" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">OS Limble / C-Tool (se houver)</label>
                        <input type="text" id="osLimble" placeholder="Ex: OS-10492" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Realizado por</label>
                        <input type="text" id="realizadoPor" placeholder="Seu nome / Técnico" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>
            </div>

            <!-- Lista Dinâmica de Equipamentos -->
            <div id="containerEquipamentos" class="space-y-4">
                <!-- Equipamento 1 (Padrão) -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-4 equipamento-bloco relative">
                    <div class="flex items-center justify-between border-b pb-2">
                        <div class="flex items-center gap-2 text-blue-700 font-semibold text-sm">
                            <i class="fa-solid fa-box"></i>
                            <span class="titulo-equipamento">EQUIPAMENTO 1</span>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Equipamento / Componente</label>
                            <input type="text" name="equipamento" placeholder="Ex: Tether Management System (TMS) / ROV" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Identificação</label>
                                <input type="text" name="identificacao" placeholder="Tag / S/N" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Fabricante</label>
                                <input type="text" name="fabricante" placeholder="Marca" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Quantidade</label>
                                <input type="number" name="quantidade" value="1" min="1" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Motivo</label>
                            <textarea name="motivo" rows="2" placeholder="Descreva detalhadamente o motivo..." class="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none resize-none"></textarea>
                        </div>

                        <!-- Fotos específicas deste equipamento -->
                        <div class="border-t pt-3 space-y-3">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-semibold text-slate-500 flex items-center gap-1">
                                    <i class="fa-solid fa-camera text-blue-600"></i> Fotos deste Equipamento
                                </span>
                                <button type="button" onclick="adicionarFoto(this)" class="text-xs bg-blue-50 text-blue-600 hover:bg-blue-100 font-medium px-2.5 py-1 rounded-lg transition flex items-center gap-1">
                                    <i class="fa-solid fa-plus"></i> Adicionar Foto
                                </button>
                            </div>
                            <div class="container-fotos space-y-2">
                                <div class="p-2.5 bg-slate-50 border border-slate-200 rounded-lg relative space-y-2 foto-item">
                                    <div class="flex justify-between items-center text-xs font-semibold text-slate-500">
                                        <span>Foto 1</span>
                                        <button type="button" onclick="removerFoto(this)" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                    <input type="file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                                    <input type="text" placeholder="Legenda da foto..." class="w-full bg-white border border-slate-300 rounded-md px-2.5 py-1 text-xs focus:ring-1 focus:ring-blue-500 focus:outline-none">
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <!-- Botões de Ação Inferiores -->
            <div class="flex gap-3">
                <button type="button" onclick="adicionarEquipamento()" class="flex-1 py-3 border-2 border-dashed border-blue-300 hover:border-blue-500 text-blue-600 hover:text-blue-700 bg-blue-50/50 rounded-xl font-medium text-sm transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> Adicionar Outro Equipamento
                </button>
                <button type="button" onclick="limparDadosSalvos()" title="Limpar formulário salvo" class="px-4 py-3 border border-red-200 hover:border-red-400 text-red-500 bg-red-50/50 rounded-xl font-medium text-sm transition flex items-center gap-2">
                    <i class="fa-solid fa-trash-can"></i> Limpar
                </button>
            </div>

        </form>
    </main>

    <!-- Modal de Resultado / Pronto -->
    <div id="modalRelatorio" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden my-8">
            <div class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between no-print-btn">
                <h3 class="font-bold text-base flex items-center gap-2">
                    <i class="fa-solid fa-file-shield text-blue-400"></i> Relatório Finalizado
                </h3>
                <button onclick="fecharModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div id="conteudoRelatorioImpresso" class="p-6 space-y-4 max-h-[70vh] overflow-y-auto text-sm text-slate-700 bg-slate-50">
                <!-- Conteúdo gerado dinamicamente -->
            </div>

            <div class="bg-white px-6 py-4 border-t border-slate-200 flex flex-wrap items-center justify-end gap-3 no-print-btn">
                <button onclick="fecharModal()" class="px-4 py-2 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-100 text-sm font-medium transition">
                    Continuar Editando
                </button>
                <button onclick="exportarPDF()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 shadow">
                    <i class="fa-solid fa-file-pdf"></i> Salvar PDF
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts de Controle -->
    <script>
        let contadorEquipamentos = 1;

        function setTipo(tipo) {
            const btnEmb = document.getElementById('tipoEmbarque');
            const btnDes = document.getElementById('tipoDesembarque');
            const valTipo = document.getElementById('valTipo');
            
            const tituloSecao = document.getElementById('tituloSecaoMovimento');
            const labelDestino = document.getElementById('labelDestino');
            const labelData = document.getElementById('labelData');

            valTipo.value = tipo;

            if (tipo === 'Embarque') {
                btnEmb.className = "py-3 px-4 rounded-xl border-2 font-medium flex items-center justify-center gap-2 transition border-blue-600 bg-blue-50 text-blue-700";
                btnDes.className = "py-3 px-4 rounded-xl border-2 font-medium flex items-center justify-center gap-2 transition border-slate-200 bg-white text-slate-600 hover:border-slate-300";
                
                tituloSecao.innerText = "RELATÓRIO DE EMBARQUE";
                labelDestino.innerText = "Recebido do(a)";
                labelData.innerText = "Data de Embarque";
            } else {
                btnDes.className = "py-3 px-4 rounded-xl border-2 font-medium flex items-center justify-center gap-2 transition border-blue-600 bg-blue-50 text-blue-700";
                btnEmb.className = "py-3 px-4 rounded-xl border-2 font-medium flex items-center justify-center gap-2 transition border-slate-200 bg-white text-slate-600 hover:border-slate-300";
                
                tituloSecao.innerText = "RELATÓRIO DE DESEMBARQUE";
                labelDestino.innerText = "Destino";
                labelData.innerText = "Data de Desembarque";
            }
        }

        function adicionarEquipamento(dados = null) {
            contadorEquipamentos++;
            const container = document.getElementById('containerEquipamentos');
            const div = document.createElement('div');
            div.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-4 equipamento-bloco relative";
            div.innerHTML = `
                <div class="flex items-center justify-between border-b pb-2">
                    <div class="flex items-center gap-2 text-blue-700 font-semibold text-sm">
                        <i class="fa-solid fa-box"></i>
                        <span class="titulo-equipamento">EQUIPAMENTO ${contadorEquipamentos}</span>
                    </div>
                    <button type="button" onclick="removerEquipamento(this)" class="text-xs text-red-500 hover:text-red-700 font-medium flex items-center gap-1">
                        <i class="fa-solid fa-trash"></i> Remover
                    </button>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Equipamento / Componente</label>
                        <input type="text" name="equipamento" value="${dados ? dados.equipamento : ''}" placeholder="Ex: Tether Management System (TMS) / ROV" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Identificação</label>
                            <input type="text" name="identificacao" value="${dados ? dados.identificacao : ''}" placeholder="Tag / S/N" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Fabricante</label>
                            <input type="text" name="fabricante" value="${dados ? dados.fabricante : ''}" placeholder="Marca" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Quantidade</label>
                            <input type="number" name="quantidade" value="${dados ? dados.quantidade : '1'}" min="1" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Motivo</label>
                        <textarea name="motivo" rows="2" placeholder="Descreva detalhadamente o motivo..." class="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none resize-none">${dados ? dados.motivo : ''}</textarea>
                    </div>

                    <!-- Fotos específicas deste equipamento -->
                    <div class="border-t pt-3 space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-semibold text-slate-500 flex items-center gap-1">
                                <i class="fa-solid fa-camera text-blue-600"></i> Fotos deste Equipamento
                            </span>
                            <button type="button" onclick="adicionarFoto(this)" class="text-xs bg-blue-50 text-blue-600 hover:bg-blue-100 font-medium px-2.5 py-1 rounded-lg transition flex items-center gap-1">
                                <i class="fa-solid fa-plus"></i> Adicionar Foto
                            </button>
                        </div>
                        <div class="container-fotos space-y-2">
                            <div class="p-2.5 bg-slate-50 border border-slate-200 rounded-lg relative space-y-2 foto-item">
                                <div class="flex justify-between items-center text-xs font-semibold text-slate-500">
                                    <span>Foto 1</span>
                                    <button type="button" onclick="removerFoto(this)" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                                </div>
                                <input type="file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                                <input type="text" placeholder="Legenda da foto..." class="w-full bg-white border border-slate-300 rounded-md px-2.5 py-1 text-xs focus:ring-1 focus:ring-blue-500 focus:outline-none">
                            </div>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(div);
            atualizarTitulosEquipamentos();
        }

        function removerEquipamento(btn) {
            if (document.querySelectorAll('.equipamento-bloco').length <= 1) {
                alert("Você precisa manter pelo menos um equipamento.");
                return;
            }
            btn.closest('.equipamento-bloco').remove();
            atualizarTitulosEquipamentos();
        }

        function atualizarTitulosEquipamentos() {
            const blocos = document.querySelectorAll('.equipamento-bloco');
            blocos.forEach((bloco, index) => {
                const span = bloco.querySelector('.titulo-equipamento');
                if (span) {
                    span.innerText = `EQUIPAMENTO ${index + 1}`;
                }
            });
            contadorEquipamentos = blocos.length;
        }

        function adicionarFoto(btnBotao) {
            const blocoEquipamento = btnBotao.closest('.equipamento-bloco');
            const containerFotos = blocoEquipamento.querySelector('.container-fotos');
            const totalFotos = containerFotos.querySelectorAll('.foto-item').length + 1;

            const div = document.createElement('div');
            div.className = "p-2.5 bg-slate-50 border border-slate-200 rounded-lg relative space-y-2 foto-item";
            div.innerHTML = `
                <div class="flex justify-between items-center text-xs font-semibold text-slate-500">
                    <span>Foto ${totalFotos}</span>
                    <button type="button" onclick="removerFoto(this)" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                </div>
                <input type="file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                <input type="text" placeholder="Legenda da foto..." class="w-full bg-white border border-slate-300 rounded-md px-2.5 py-1 text-xs focus:ring-1 focus:ring-blue-500 focus:outline-none">
            `;
            containerFotos.appendChild(div);
        }

        function removerFoto(btn) {
            const container = btn.closest('.container-fotos');
            btn.closest('.foto-item').remove();
            
            if (container) {
                const itens = container.querySelectorAll('.foto-item');
                itens.forEach((item, idx) => {
                    const spanNum = item.querySelector('span');
                    if (spanNum) spanNum.innerText = `Foto ${idx + 1}`;
                });
            }
        }

        function lerFotoComoBase64(input) {
            return new Promise((resolve) => {
                if (!input.files || !input.files[0]) {
                    resolve(null);
                    return;
                }
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = () => resolve(null);
                reader.readAsDataURL(input.files[0]);
            });
        }

        // --- SISTEMA DE SALVAR E CARREGAR (LOCALSTORAGE) ---
        function salvarRascunhoManual() {
            const dadosGerais = {
                tipo: document.getElementById('valTipo').value,
                destino: document.getElementById('destino').value,
                dataMov: document.getElementById('dataMov').value,
                osLimble: document.getElementById('osLimble').value,
                realizadoPor: document.getElementById('realizadoPor').value
            };

            const blocos = document.querySelectorAll('.equipamento-bloco');
            let equipamentos = [];
            blocos.forEach(bloco => {
                equipamentos.push({
                    equipamento: bloco.querySelector('input[name="equipamento"]').value,
                    identificacao: bloco.querySelector('input[name="identificacao"]').value,
                    fabricante: bloco.querySelector('input[name="fabricante"]').value,
                    quantidade: bloco.querySelector('input[name="quantidade"]').value,
                    motivo: bloco.querySelector('textarea[name="motivo"]').value
                });
            });

            const rascunho = { dadosGerais, equipamentos };
            localStorage.setItem('relatorio_rov_rascunho', JSON.stringify(rascunho));
            
            alert("Progresso salvo com sucesso!");
        }

        function carregarRascunho() {
            const salvo = localStorage.getItem('relatorio_rov_rascunho');
            if (!salvo) return;

            try {
                const rascunho = JSON.parse(salvo);
                
                // Carregar dados gerais
                if (rascunho.dadosGerais) {
                    setTipo(rascunho.dadosGerais.tipo || 'Embarque');
                    document.getElementById('destino').value = rascunho.dadosGerais.destino || '';
                    document.getElementById('dataMov').value = rascunho.dadosGerais.dataMov || '';
                    document.getElementById('osLimble').value = rascunho.dadosGerais.osLimble || '';
                    document.getElementById('realizadoPor').value = rascunho.dadosGerais.realizadoPor || '';
                }

                // Carregar equipamentos
                if (rascunho.equipamentos && rascunho.equipamentos.length > 0) {
                    const container = document.getElementById('containerEquipamentos');
                    container.innerHTML = ''; // Limpar padrão
                    contadorEquipamentos = 0;

                    rascunho.equipamentos.forEach(eq => {
                        adicionarEquipamento(eq);
                    });
                }
            } catch (e) {
                console.error("Erro ao carregar rascunho:", e);
            }
        }

        function limparDadosSalvos() {
            if (confirm("Tem certeza que deseja apagar todos os dados salvos e reiniciar?")) {
                localStorage.removeItem('relatorio_rov_rascunho');
                location.reload();
            }
        }

        async function gerarRelatorioFinal() {
            const tipo = document.getElementById('valTipo').value;
            const destino = document.getElementById('destino').value || 'Não informado';
            const dataMov = document.getElementById('dataMov').value || 'Não informada';
            const osLimble = document.getElementById('osLimble').value || 'Não informada';
            const realizadoPor = document.getElementById('realizadoPor').value || 'Não informado';

            const blocos = document.querySelectorAll('.equipamento-bloco');
            let listaEquipamentos = [];

            for (let i = 0; i < blocos.length; i++) {
                const bloco = blocos[i];
                
                const fotoItems = bloco.querySelectorAll('.foto-item');
                let fotosDesteEquipamento = [];

                for (let j = 0; j < fotoItems.length; j++) {
                    const fItem = fotoItems[j];
                    const input = fItem.querySelector('input[type="file"]');
                    const legendaInput = fItem.querySelector('input[type="text"]');

                    const base64 = await lerFotoComoBase64(input);
                    if (base64) {
                        fotosDesteEquipamento.push({
                            src: base64,
                            legenda: legendaInput ? (legendaInput.value || `Foto ${j + 1}`) : `Foto ${j + 1}`
                        });
                    }
                }

                listaEquipamentos.push({
                    equipamento: bloco.querySelector('input[name="equipamento"]').value || 'Não informado',
                    identificacao: bloco.querySelector('input[name="identificacao"]').value || 'Não informada',
                    fabricante: bloco.querySelector('input[name="fabricante"]').value || 'Não informado',
                    quantidade: bloco.querySelector('input[name="quantidade"]').value || '1',
                    motivo: bloco.querySelector('textarea[name="motivo"]').value || 'Nenhum motivo detalhado.',
                    fotos: fotosDesteEquipamento
                });
            }

            const rotuloData = `Data de ${tipo}`;
            const rotuloDestino = tipo === 'Embarque' ? 'Recebido do(a)' : 'Destino';

            let itensHtml = '';
            listaEquipamentos.forEach((item, index) => {
                let fotosHtmlItem = '';
                if (item.fotos.length > 0) {
                    let linhasFotos = '';
                    for (let f = 0; f < item.fotos.length; f += 2) {
                        const foto1 = item.fotos[f];
                        const foto2 = item.fotos[f + 1];

                        linhasFotos += `
                            <div style="display: flex; gap: 10px; margin-bottom: 8px;">
                                <div style="flex: 1; background: #fff; padding: 4px; border: 1px solid #cbd5e1; border-radius: 4px; text-align: center;">
                                    <img src="${foto1.src}" style="max-height: 130px; width: 100%; object-fit: contain; border-radius: 3px;" />
                                    <p style="font-size: 9px; color: #475569; margin-top: 3px; font-weight: 500;">${foto1.legenda}</p>
                                </div>
                                <div style="flex: 1; background: #fff; padding: 4px; border: 1px solid #cbd5e1; border-radius: 4px; text-align: center;">
                                    ${foto2 ? `<img src="${foto2.src}" style="max-height: 130px; width: 100%; object-fit: contain; border-radius: 3px;" />
                                    <p style="font-size: 9px; color: #475569; margin-top: 3px; font-weight: 500;">${foto2.legenda}</p>` : ''}
                                </div>
                            </div>
                        `;
                    }

                    fotosHtmlItem = `
                        <div style="margin-top: 8px; border-top: 1px dashed #cbd5e1; padding-top: 6px;">
                            <strong style="font-size: 10px; color: #64748b; display: block; margin-bottom: 6px; text-transform: uppercase;">Evidências Fotográficas:</strong>
                            ${linhasFotos}
                        </div>
                    `;
                }

                itensHtml += `
                    <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; margin-bottom: 10px; page-break-inside: avoid;">
                        <div style="font-size: 12px; font-weight: bold; color: #1e40af; margin-bottom: 6px;">Item ${index + 1}: ${item.equipamento}</div>
                        <table style="width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 6px;">
                            <tr>
                                <td style="padding: 3px 0; width: 50%;"><strong>Identificação:</strong> ${item.identificacao}</td>
                                <td style="padding: 3px 0; width: 50%;"><strong>Fabricante:</strong> ${item.fabricante}</td>
                            </tr>
                            <tr>
                                <td style="padding: 3px 0;" colspan="2"><strong>Quantidade:</strong> ${item.quantidade}</td>
                            </tr>
                        </table>
                        <div style="border-top: 1px dashed #cbd5e1; padding-top: 6px; margin-top: 4px; margin-bottom: 6px;">
                            <strong style="font-size: 10px; color: #64748b; text-transform: uppercase;">Motivo do ${tipo}:</strong>
                            <p style="color: #334155; font-size: 11px; margin-top: 2px;">${item.motivo}</p>
                        </div>
                        ${fotosHtmlItem}
                    </div>
                `;
            });

            let html = `
                <div style="background: white; padding: 16px; border-radius: 12px; border: 1px solid #e2e8f0;">
                    <div style="border-bottom: 2px solid #2563eb; padding-bottom: 10px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <span style="background: #dbeafe; color: #1e40af; font-size: 10px; font-weight: bold; padding: 4px 8px; border-radius: 4px; text-transform: uppercase;">${tipo} de Equipamento</span>
                            <h2 style="font-size: 15px; font-weight: bold; color: #0f172a; margin-top: 6px;">ROV Operations</h2>
                        </div>
                        <span style="font-size: 11px; color: #64748b; font-weight: 600;">Relatório Técnico</span>
                    </div>
                    
                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 14px; font-size: 11px;">
                        <tr>
                            <td style="padding: 5px 0; border-bottom: 1px solid #f1f5f9; width: 50%;"><strong>${rotuloDestino}:</strong> ${destino}</td>
                            <td style="padding: 5px 0; border-bottom: 1px solid #f1f5f9; width: 50%;"><strong>${rotuloData}:</strong> ${dataMov}</td>
                        </tr>
                        <tr>
                            <td style="padding: 5px 0; border-bottom: 1px solid #f1f5f9;" colspan="2"><strong>OS Limble / C-Tool:</strong> ${osLimble}</td>
                        </tr>
                        <tr>
                            <td style="padding: 5px 0;" colspan="2"><strong>Realizado por:</strong> ${realizadoPor}</td>
                        </tr>
                    </table>

                    <div style="margin-bottom: 10px;">
                        <strong style="font-size: 11px; color: #64748b; display: block; margin-bottom: 8px; text-transform: uppercase;"><i class="fa-solid fa-tag"></i> Equipamentos Relacionados:</strong>
                        ${itensHtml}
                    </div>
                </div>
            `;

            document.getElementById('conteudoRelatorioImpresso').innerHTML = html;
            document.getElementById('modalRelatorio').classList.remove('hidden');
        }

        function fecharModal() {
            document.getElementById('modalRelatorio').classList.add('hidden');
        }

        function exportarPDF() {
            window.print();
        }
    </script>
</body>
</html>
